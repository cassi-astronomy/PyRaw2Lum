[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyraw2lum"
version = "0.5.0"
description = "PyRaw2Lum - mereni jasu oblohy z DSLR RAW snimku"
readme = "README.md"
authors = [{name = "Martin Mašek"}]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "rawpy>=0.27.1",
    "exifread>=3.0",
    "Pillow>=10.0",
    "tkinterdnd2>=0.4",
    "astropy>=6.0",
]

[project.scripts]
pyraw2lum = "raw2lum.cli:main"
pyraw2lum-gui = "raw2lum.gui:main"
# Puvodni prikazy zustavaji jako kompatibilni aliasy.
raw2lum = "raw2lum.cli:main"
raw2lum-gui = "raw2lum.gui:main"

[project.urls]
Homepage = "https://github.com/cassi-astronomy/PyRaw2Lum"
Repository = "https://github.com/cassi-astronomy/PyRaw2Lum"
Issues = "https://github.com/cassi-astronomy/PyRaw2Lum/issues"

[tool.setuptools.packages.find]
include = ["raw2lum*"]

[tool.setuptools.package-data]
raw2lum = ["data/*.csv", "data/*.md"]
